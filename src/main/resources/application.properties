spring.application.name=mathe-quidditch
spring.main.banner-mode=off
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/mathe-quidditch;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=false
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=4h
server.error.include-message=always
server.shutdown=graceful
